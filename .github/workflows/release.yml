name: Release

on:
  push:
    branches: [main]

# The job creates the release tag through the API, so it needs contents: write
# and nothing else. The template isn't published to NuGet: packing it here
# only checks that it still packages.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6
        with:
          global-json-file: content/global.json

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f  # v4.7.0
        with:
          versionSpec: "6.x"

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f  # v4.7.0
        with:
          configFilePath: GitVersion.yml

      - name: Pack template
        run: dotnet pack Mpaulosky.BlazorServerTemplate.csproj --configuration Release -p:PackageVersion=${{ steps.gitversion.outputs.semVer }} --output artifacts

      - name: Tag release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/v${{ steps.gitversion.outputs.semVer }}',
              sha: context.sha
            });
